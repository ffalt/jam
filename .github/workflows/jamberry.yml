name: Test JamBerry

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "jamberry/**"
      - ".github/workflows/jamberry.yml"
  push:
    branches:
      - main
    tags-ignore:
      - "**"
    paths:
      - "jamberry/**"
      - "!jamberry/**/*.md"
      - ".github/workflows/jamberry.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: jamberry
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false
      - run: npm ci
      - name: Test
        if: github.event_name == 'pull_request'
        run: npm run test
      - name: Test with coverage
        if: github.event_name != 'pull_request'
        run: npm run test:coverage -- --coverage-reporters=lcov
      - uses: qltysh/qlty-action/coverage@v2.7.0
        if: github.event_name != 'pull_request'
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: jamberry/coverage/jamberry/lcov.info
          add-prefix: jamberry/
