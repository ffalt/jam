name: Test JamServe

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "jamserve/**"
      - ".github/workflows/jamserve.yml"
  push:
    branches:
      - main
    tags-ignore:
      - "**"
    paths:
      - "jamserve/**"
      - "!jamserve/**/*.md"
      - ".github/workflows/jamserve.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ffalt/jam-test:26.04
      options: --user 1001
    env:
      JAM_DB_HOST: postgres
      NODE_ENV: development
    defaults:
      run:
        working-directory: jamserve
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false
      - run: npm ci
      - name: Try to build
        run: npm run build
      - name: Test
        if: github.event_name == 'pull_request'
        run: npm run test
        env:
          API_SPEC_TEST: false
      - name: Test with coverage
        if: github.event_name != 'pull_request'
        run: npm run coverage
        env:
          API_SPEC_TEST: false
      - uses: qltysh/qlty-action/coverage@v2.7.0
        if: github.event_name != 'pull_request'
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: jamserve/coverage/lcov.info
          add-prefix: jamserve/
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_DB: jamtest
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
