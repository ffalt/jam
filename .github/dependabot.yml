version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
    semver-major-days: 30
    semver-minor-days: 14
    semver-patch-days: 5
- package-ecosystem: npm
  directory: /jamserve
  schedule:
    interval: weekly
    time: "04:00"
  open-pull-requests-limit: 10
  commit-message:
    prefix: chore
    include: scope
  cooldown:
    default-days: 7
    semver-major-days: 30
    semver-minor-days: 14
    semver-patch-days: 5
- package-ecosystem: npm
  directory: /jamberry
  schedule:
    interval: weekly
  commit-message:
    prefix: chore
    include: scope
  groups:
    angular:
      patterns:
        - "@angular*"
  cooldown:
    default-days: 7
    semver-major-days: 30
    semver-minor-days: 14
    semver-patch-days: 5
- package-ecosystem: docker
  directories:
    - /docker/jam
    - /docker/test
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  target-branch: main
  cooldown:
    default-days: 7
  groups:
    codeql-action:
      patterns:
        - "github/codeql-action/*"
